[project]
name = "ha-stundenplan"
version = "1.0.0"
description = "Home Assistant Integration für Indiware Stundenplan"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "ASYNC", # flake8-async
]
ignore = [
  "E501", # line length is enforced by the formatter instead
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.stundenplan"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# homeassistant ships inline types (py.typed), so mypy tries to fully parse
# its actual source rather than just trusting `ignore_missing_imports`. Home
# Assistant's own codebase already uses Python 3.14-only syntax (PEP 758
# unparenthesized `except`) that mypy's parser doesn't support yet, which
# crashes the whole run. We only need type information for the symbols we
# import, not a full analysis of Home Assistant's internals - skip parsing
# its source and treat it as an untyped (Any) dependency instead.
[[tool.mypy.overrides]]
module = "homeassistant.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
