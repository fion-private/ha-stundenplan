name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.6"

      - name: Ruff check (PEP 8 / pyflakes / isort / bugbear ...)
        run: ruff check --output-format=github .

      - name: Ruff format (Black-kompatibler Style)
        run: ruff format --check --diff .

  typecheck:
    name: Static type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Mypy
        run: mypy custom_components

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Run pytest
        run: pytest --cov=custom_components/stundenplan --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml

  hassfest:
    name: Home Assistant hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
